name: Crear APK Android
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '17 3 */3 * *'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recuperar firma permanente
        uses: actions/cache@v4
        with:
          path: app/stable-debug.keystore
          key: encargos-caza-firma-android-v2
      - name: Comprobar que la firma original está disponible
        run: |
          if [ ! -f app/stable-debug.keystore ]; then
            echo 'Falta la firma Android. No se generará otra: hay que restaurar la copia protegida.' >&2
            exit 1
          fi
      - name: Compilar APK
        run: gradle :app:assembleDebug
      - name: Proteger copia de la firma
        run: openssl cms -encrypt -binary -aes256 -in app/stable-debug.keystore -out app/stable-debug.keystore.cms -outform DER app/signing-backup-public.pem
      - name: Guardar firma cifrada
        uses: actions/upload-artifact@v4
        with:
          name: Firma-cifrada-Caza-La-Polleria
          path: app/stable-debug.keystore.cms
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Encargos-Caza-La-Polleria-APK
          path: app/build/outputs/apk/debug/app-debug.apk

