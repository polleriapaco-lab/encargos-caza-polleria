name: Compilar Recetas Android
on:
  push:
    branches: [recetas-android]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p recetas-android :app:assembleDebug
      - run: |
          cp recetas-android/app/build/outputs/apk/debug/app-debug.apk Recetas-La-Polleria-Android-prueba.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs Recetas-La-Polleria-Android-prueba.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Recetas-La-Polleria-Android
          path: Recetas-La-Polleria-Android-prueba.apk
