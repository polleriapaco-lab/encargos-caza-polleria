plugins { id 'com.android.application' }
android {
    namespace 'es.lapolleria.caza'
    compileSdk 35
    signingConfigs {
        debug {
            storeFile file('stable-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    defaultConfig {
        applicationId 'es.lapolleria.caza'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.4'
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
